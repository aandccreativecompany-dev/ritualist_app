name: ritualist
description: Prakriyā — a daily ritual and manifestation practice app.
publish_to: 'none'
version: 0.2.2+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  flutter_timezone: 3.0.1
  google_fonts: ^6.2.1
  share_plus: ^12.0.2
  local_auth: ^2.3.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#150C28"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
